<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Bluetooth Controller</title>
<style>
* { box-sizing: border-box; }
body { background:#10151e; color:white; font-family:Arial,sans-serif; text-align:center; margin:0; padding:20px; }
h2 { margin-bottom:8px; }
.status { background:#202b39; padding:12px; border-radius:12px; margin:15px auto; max-width:400px; overflow-wrap:anywhere; }
button { border:0; border-radius:14px; padding:17px; font-size:18px; font-weight:bold; color:white; background:#34465e; touch-action:none; user-select:none; }
button:active { background:#5279a5; }
.connect { background:#168c61; width:100%; max-width:400px; }
.stop { background:#d63232; width:100%; max-width:400px; font-size:24px; margin-top:15px; }
.pad { display:grid; grid-template-columns:85px 85px 85px; grid-template-rows:75px 75px 75px; gap:8px; justify-content:center; margin:25px auto; }
.up { grid-area:1 / 2; } .left { grid-area:2 / 1; } .down { grid-area:2 / 2; } .right { grid-area:2 / 3; }
.panel { background:#202b39; border-radius:15px; padding:18px; max-width:400px; margin:18px auto; }
input[type=range] { width:100%; margin:20px 0; accent-color:#36b98a; }
#messages { background:#080c12; padding:12px; border-radius:10px; height:140px; overflow-y:auto; text-align:left; font-family:monospace; font-size:12px; overflow-wrap:anywhere; }
.small { color:#aab6c5; font-size:13px; }
</style>
</head>
<body>
<h2>ESP32 RC Controller</h2>
<div class="small">Bluetooth Low Energy</div>
<div class="status" id="status">Not connected</div>
<button class="connect" id="connect">CONNECT TO ESP32</button>

<div class="pad">
  <button class="up" data-dir="UP">▲</button>
  <button class="left" data-dir="LEFT">◀</button>
  <button class="down" data-dir="DOWN">▼</button>
  <button class="right" data-dir="RIGHT">▶</button>
</div>
<button class="stop" id="stop">STOP</button>

<div class="panel">
  <h3>THROTTLE</h3>
  <h1 id="throttleValue">0%</h1>
  <input id="throttle" type="range" min="0" max="100" value="0">
  <div class="small">0–100%</div>
</div>

<div class="panel">
  <h3>ESP32 Messages</h3>
  <div id="messages">Waiting for connection...</div>
</div>

<script>
const SERVICE_UUID = "12345678-1234-1234-1234-123456789000";
const RX_UUID = "12345678-1234-1234-1234-123456789001";
const TX_UUID = "12345678-1234-1234-1234-123456789002";

let device, server, rx, tx;
const status = document.getElementById("status");
const messages = document.getElementById("messages");

function log(message) {
  const line = document.createElement("div");
  line.textContent = message;
  messages.appendChild(line);
  messages.scrollTop = messages.scrollHeight;
}
function setStatus(message) { status.textContent = message; }

async function sendCommand(command) {
  if (!rx) { log("Not connected; command ignored: " + command); return; }
  try {
    const data = new TextEncoder().encode(command);
    await rx.writeValueWithResponse(data);
    log("Sent: " + command);
  } catch (error) { log("Send error: " + error.message); }
}

async function connectBLE() {
  try {
    if (!navigator.bluetooth) {
      setStatus("Web Bluetooth unavailable. Use Chrome on Android over HTTPS.");
      return;
    }
    setStatus("Selecting ESP32...");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    device.addEventListener("gattserverdisconnected", () => {
      rx = null; tx = null; setStatus("Disconnected"); log("Bluetooth disconnected");
    });
    setStatus("Connecting...");
    server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    rx = await service.getCharacteristic(RX_UUID);
    tx = await service.getCharacteristic(TX_UUID);
    await tx.startNotifications();
    tx.addEventListener("characteristicvaluechanged", event => {
      const value = new TextDecoder().decode(event.target.value);
      log("ESP32: " + value);
    });
    setStatus("Connected to " + (device.name || "ESP32"));
    log("Bluetooth connected; notifications enabled");
  } catch (error) { setStatus("Connection failed"); log(error.message); }
}
document.getElementById("connect").addEventListener("click", connectBLE);

document.querySelectorAll("[data-dir]").forEach(button => {
  const direction = button.dataset.dir;
  let pressed = false;
  const press = event => {
    event.preventDefault();
    if (pressed) return;
    pressed = true;
    sendCommand(direction);
  };
  const release = event => {
    if (!pressed) return;
    pressed = false;
    if (event) event.preventDefault();
    sendCommand("STOP");
  };
  button.addEventListener("pointerdown", press);
  button.addEventListener("pointerup", release);
  button.addEventListener("pointerleave", release);
  button.addEventListener("pointercancel", release);
});
document.getElementById("stop").addEventListener("click", () => sendCommand("STOP"));

const throttle = document.getElementById("throttle");
throttle.addEventListener("input", () => {
  document.getElementById("throttleValue").textContent = throttle.value + "%";
});
let lastThrottle = -1;
throttle.addEventListener("change", () => {
  if (Number(throttle.value) !== lastThrottle) {
    lastThrottle = Number(throttle.value);
    sendCommand("THROTTLE:" + throttle.value);
  }
});
</script>
</body>
</html>
